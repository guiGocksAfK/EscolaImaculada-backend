services:
  db:
    image: postgres:16-alpine
    container_name: escola-imaculada-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: escola
      POSTGRES_PASSWORD: escola
      POSTGRES_DB: escola_imaculada
    ports:
      - '5432:5432'
    volumes:
      - escola_pgdata:/var/lib/postgresql/data

volumes:
  escola_pgdata:
